[bdist_wheel]
universal = 0

[options.extras_require]
test =
    pytest
    pytest-cov

[aliases]
test = pytest

[tool:pytest]
python_files =
    test_*.py
    tests.py

addopts =
    -ra
    --ignore=setup.py
    --ignore=ci
    --ignore=.eggs
    --doctest-modules
    --doctest-glob=\*.rst
    --tb=short

testpaths =
    tests
